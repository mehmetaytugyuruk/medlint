name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: >-
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          tag=os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{version}', f'tag {tag!r} does not match package version {version!r}'"
      - name: Verify tag commit belongs to main history
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test, schema, and coverage gate
        run: pytest

  build-and-verify:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and release tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run static quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy src/medlint
      - name: Build distributions
        run: python -m build
      - name: Check wheel and source-distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Clean-install and smoke-test wheel
        run: |
          wheel_environment="$RUNNER_TEMP/medlint-wheel-environment"
          python -m venv "$wheel_environment"
          "$wheel_environment/bin/python" -m pip install --upgrade pip
          "$wheel_environment/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_environment/bin/medlint" --help
          "$wheel_environment/bin/medlint" audit --help
      - name: Clean-install and smoke-test source distribution
        run: |
          sdist_environment="$RUNNER_TEMP/medlint-sdist-environment"
          python -m venv "$sdist_environment"
          "$sdist_environment/bin/python" -m pip install --upgrade pip
          "$sdist_environment/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$sdist_environment/bin/medlint" --help
          "$sdist_environment/bin/medlint" audit --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts
    runs-on: ubuntu-latest
    needs: build-and-verify
    environment:
      name: pypi
      url: https://pypi.org/p/medlint
    permissions:
      actions: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # One-time v0.1.0 bootstrap credential. Delete the protected
          # environment secret immediately after the successful release.
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
